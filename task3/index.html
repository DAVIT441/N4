<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Quotes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-center">
    <h1 class="text-xl font-bold mb-4 text-sky-400">დღის ციტატა</h1>
    <div class="min-h-[100px] flex flex-col justify-center items-center bg-slate-800/50 border border-slate-700/60 rounded-xl p-4 mb-5">
      <p id="quoteText" class="text-sm text-slate-200 font-medium italic mb-2">დააჭირეთ ღილაკს ციტატის გამოსაჩენად</p>
      <p id="authorText" class="text-xs text-sky-400 font-semibold"></p>
    </div>
    <button id="newQuoteBtn" class="w-full bg-sky-500 hover:bg-sky-600 px-4 py-2.5 rounded-xl text-sm font-medium transition">ახალი ციტატა</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
