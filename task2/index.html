<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Bug Fixing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold">დავალებების სია</h1>
      <span class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">სულ: <span id="taskCounter" class="text-sky-400 font-bold">0</span></span>
    </div>
    <div class="flex gap-2 mb-4">
      <input type="text" id="taskInput" placeholder="ახალი დავალება..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-sky-500 transition">
      <button id="addTaskBtn" class="bg-sky-500 hover:bg-sky-600 px-4 py-2 rounded-xl text-sm font-medium transition">დამატება</button>
    </div>
    <ul id="taskList" class="space-y-2"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
