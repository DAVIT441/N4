<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Skills Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
    <h1 class="text-xl font-bold mb-4">Skills Tracker</h1>
    <div class="flex gap-2 mb-3">
      <input id="skill-input" type="text" placeholder="ჩაწერეთ უნარი..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-sky-500">
      <button id="add-btn" class="bg-sky-500 hover:bg-sky-600 px-4 py-2 rounded-xl text-sm font-medium transition">დამატება</button>
    </div>
    <p id="error-message" class="text-rose-400 text-xs mb-3 hidden">გთხოვთ ჩაწეროთ ტექსტი!</p>
    <div class="flex justify-between items-center mb-4">
      <p id="status-message" class="text-sm text-slate-400 font-medium">სია ჯერ ცარიელია</p>
      <span class="text-xs text-slate-500">სულ: <span id="counter">0</span></span>
    </div>
    <ul id="skills-list" class="space-y-2 mb-4"></ul>
    <button id="clear-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-sm font-medium transition">გასუფთავება</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
